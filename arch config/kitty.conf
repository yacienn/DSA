# ============================================================
# KITTY - GREY + TRANSPARENT THEME
# ============================================================


# -------------------------
# FONT
# -------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.5


# -------------------------
# WINDOW
# -------------------------

# Transparency
background_opacity 0.82

# Slightly transparent inactive windows
inactive_text_alpha 0.85

# Window padding
window_padding_width 10

# Remove title bar decorations
hide_window_decorations titlebar-only

# Don't change size when font changes
remember_window_size yes


# -------------------------
# GREY COLOR THEME
# -------------------------

# Main colors
foreground       #d0d0d0
background       #151515

# Cursor
cursor           #c0c0c0
cursor_text_color #151515

# Selection
selection_foreground #151515
selection_background #b0b0b0


# -------------------------
# NORMAL COLORS
# -------------------------

color0  #1a1a1a
color1  #8a8a8a
color2  #9a9a9a
color3  #aaaaaa
color4  #888888
color5  #999999
color6  #b0b0b0
color7  #d0d0d0


# -------------------------
# BRIGHT COLORS
# -------------------------

color8  #404040
color9  #a0a0a0
color10 #b0b0b0
color11 #c0c0c0
color12 #989898
color13 #aaaaaa
color14 #c0c0c0
color15 #eeeeee


# -------------------------
# CURSOR
# -------------------------

cursor_shape beam
cursor_blink_interval 0.5


# -------------------------
# SCROLLING
# -------------------------

scrollback_lines 10000
wheel_scroll_multiplier 3.0


# -------------------------
# TAB BAR
# -------------------------

tab_bar_edge bottom
tab_bar_style powerline

active_tab_foreground   #eeeeee
active_tab_background   #333333

inactive_tab_foreground #999999
inactive_tab_background #181818


# -------------------------
# MOUSE
# -------------------------

copy_on_select yes
strip_trailing_spaces smart


# -------------------------
# URLS
# -------------------------

url_color #aaaaaa
url_style curly


# -------------------------
# PERFORMANCE
# -------------------------

repaint_delay 10
input_delay 3
sync_to_monitor yes


# -------------------------
# TERMINAL BELL
# -------------------------

enable_audio_bell no
visual_bell_duration 0.0


# -------------------------
# KEYBOARD SHORTCUTS
# -------------------------

# New window
map ctrl+shift+enter new_window

# New tab
map ctrl+shift+t new_tab

# Close tab
map ctrl+shift+w close_tab

# Next tab
map ctrl+tab next_tab

# Previous tab
map ctrl+shift+tab previous_tab

# Reload Kitty config
map ctrl+shift+f5 load_config_file


# -------------------------
# WINDOW MANAGEMENT
# -------------------------

# Vertical split
map ctrl+shift+d launch --location=vsplit

# Horizontal split
map ctrl+shift+h launch --location=hsplit
hl.windowrule({
    name = "opacity",
    rule = "opacity 0.85 0.85",
    match = {
        class = "code",
    },
})

# -------------------------
# SEARCH
# -------------------------

map ctrl+shift+f show_scrollback


# -------------------------
# SHELL
# -------------------------

shell_integration enabled


# -------------------------
# LINUX
# -------------------------

linux_display_server auto
